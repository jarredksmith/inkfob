# XcodeGen spec for the Inkfob iPhone app. The workflow runs `xcodegen generate` on the GitHub Mac,
# so no hand-edited .xcodeproj lives in the repo.
name: Inkfob
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.4"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: SVYYTM3LTN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Inkfob:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarredsmith.inkfob
        PRODUCT_NAME: Inkfob
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Inkfob
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Inkfob joins your pager's Bluetooth connection to send it weather, calendar events, files and updates."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Inkfob uses your location to get the local forecast it shows on your pager."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Inkfob reads your next events so it can show them on your pager."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Inkfob reads the reminders due today so it can show them on your pager."
        INFOPLIST_KEY_NSMotionUsageDescription: "Inkfob reads today's step count so it can show it on your pager."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
